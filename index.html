<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🪐 哈基咪星球 🪐</title>
    <style>
        /* ========== 全局樣式 ========== */
        body { background-color: #f7f9fa; color: #2c3e50; font-family: 'Courier New', Courier, monospace, "微軟正黑體"; margin: 0; padding: 0; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
        h1, h2, h3 { margin: 5px 0; }
        button { font-family: inherit; font-weight: bold; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        button:hover { background-color: #2c3e50 !important; color: white !important; }
        .hidden { display: none !important; }

        /* ========== 首頁與選角 ========== */
        #screen-start, #screen-select { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f7f9fa; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .btn-main { padding: 15px 40px; font-size: 20px; background: white; border: 3px solid #2c3e50; box-shadow: 5px 5px 0px #2c3e50; margin-top: 20px; }
        .select-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; max-height: 70vh; overflow-y: auto; padding: 20px; background: white; border: 3px solid #2c3e50; border-radius: 8px; margin-top: 20px; }
        .select-card { border: 2px solid #2c3e50; border-radius: 6px; padding: 10px; background: #f8f9fa; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; }
        .select-card:hover { transform: scale(1.05); background: #e2e7ea; }
        .select-card img { width: 100%; height: 100px; object-fit: contain; animation: floatIdle 2s infinite ease-in-out; }
        .select-card .name { font-weight: bold; margin-top: 5px; }
        .select-card .duty { font-size: 11px; color: #7f8c8d; }

        /* ========== 開場過場動畫 ========== */
        #screen-transition { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; z-index: 10001; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #2c3e50; }
        .cushion { width: 200px; height: 80px; background: #8e44ad; border-radius: 50%; position: relative; display: flex; justify-content: center; align-items: center; border: 4px solid #2c3e50; }
        .wake-cat { width: 140px; height: 140px; position: absolute; bottom: 20px; opacity: 0; transform: rotate(-90deg); transition: opacity 0.5s; object-fit: contain; filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.2)); }
        .wake-cat.awake { opacity: 1; animation: jumpTwice 1.5s ease-in-out forwards; }
        .wake-text { margin-top: 30px; font-size: 22px; opacity: 0; transition: opacity 1s; font-weight: bold; color: #f39c12; }

        @keyframes jumpTwice {
            0% { transform: translateY(0) scale(1); }
            20% { transform: translateY(-40px) scale(1.1); }
            40% { transform: translateY(0) scale(0.9); }
            60% { transform: translateY(-40px) scale(1.1); }
            80% { transform: translateY(0) scale(0.9); }
            100% { transform: translateY(0) scale(1); }
        }
        @keyframes floatIdle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* ========== 遊戲主介面 ========== */
        #game-container { display: none; width: 100vw; height: 100vh; position: relative; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; background: white; border-bottom: 3px solid #2c3e50; position: relative; z-index: 10; height: 55px; box-sizing: border-box;}
        .server-announcement { font-size: 14px; color: #e74c3c; font-weight: bold; }
        .nav-btns button { border: 2px solid #2c3e50; background: white; padding: 5px 10px; margin-left: 5px; font-size: 13px; }

                /* ========== 萬聖節海洋 ========== */
        #map-area { position: absolute; top: 0; bottom: 0; left: 0; right: 0; overflow: hidden; cursor: crosshair; background-color: #2b1b3d; background-image: url("data:image/svg+xml,%3Csvg width='200' height='40' viewBox='0 0 200 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 20 Q 50 40 100 20 T 200 20' stroke='%238e44ad' stroke-width='3' fill='none' fill-opacity='0.4' stroke-opacity='0.6'/%3E%3C/svg%3E"); background-size: 200px 40px; animation: seaWave 15s linear infinite; }
        @keyframes seaWave { 0% { background-position: 0 0; } 100% { background-position: 200px 0; } }
        
        /* ========== 萬聖節泥地 ========== */
        #map-content { position: absolute; width: 4000px; height: 4500px; transform-origin: 0 0; transition: transform 0.2s ease-out; border: 5px solid #e67e22; box-shadow: inset 0 0 30px rgba(230, 126, 34, 0.2); background-color: #1e2a21; background-image: radial-gradient(#d35400 2px, transparent 0); } 
        
        /* ========== 建築排版 ========== */
        .building { position: absolute; box-sizing: border-box; background-color: transparent; border: none; font-weight: bold; text-align: center; cursor: pointer; user-select: none; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 600px; height: 600px; padding: 20px; transition: transform 0.2s; }
        .building:hover { transform: scale(1.05) translateY(-8px); }
        .building-img { width: 440px; height: 440px; background-size: contain; background-position: center; background-repeat: no-repeat; margin-bottom: 20px; filter: drop-shadow(0px 10px 15px rgba(230, 126, 34, 0.4)); }
        .building-text { font-size: 44px; font-weight: bold; color: #f39c12; line-height: 1.2; background: rgba(0, 0, 0, 0.7); padding: 10px 20px; border-radius: 12px; text-shadow: 2px 2px 0px #000, -2px -2px 0px #000; border: 2px solid #e67e22; }
        .cat-name-tag { position: absolute; top: -25px; background: rgba(0, 0, 0, 0.8); border: 2px solid #e67e22; border-radius: 10px; padding: 2px 8px; font-size: 12px; font-weight: bold; color: #f39c12; white-space: nowrap; pointer-events: none; transform: none !important; }

        /* 貓咪角色 */
        .cat-avatar { position: absolute; width: 100px; height: 100px; transition: top 0.5s linear, left 0.5s linear; cursor: pointer; z-index: 5; display: flex; justify-content: center; align-items: flex-end; }
        .cat-img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0px 5px 2px rgba(0,0,0,0.2)); }
        .cat-name-tag { position: absolute; top: -25px; background: rgba(255,255,255,0.9); border: 1px solid #2c3e50; border-radius: 10px; padding: 2px 8px; font-size: 12px; font-weight: bold; white-space: nowrap; pointer-events: none; transform: none !important; }
        .facing-right .cat-img { transform: scaleX(-1) !important; }

        /* 縮放按鈕 */
        .zoom-controls { position: fixed; right: 20px; bottom: 30px; display: flex; flex-direction: column; gap: 10px; z-index: 99999; }
        .zoom-controls button { width: 40px; height: 40px; font-size: 20px; background: white; border: 2px solid #2c3e50; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 2px 2px 0px #2c3e50; }
        
        @media screen and (max-width: 768px) {
            .top-nav { flex-direction: column; padding: 5px 10px; gap: 5px; }
            .select-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; width: 95%; padding: 10px; }
            .modal { width: 90%; }
        }
      /* ========== 萬聖節漂浮南瓜燈 ========== */
.floating-pumpkin {
    position: absolute;
    z-index: 0; 
    pointer-events: none; 
    filter: drop-shadow(0px 5px 10px rgba(230, 126, 34, 0.6)); 
    /* 👇 改成從左漂到右的動畫，時間設長一點 (例如 20 秒) */
    animation: driftPumpkin 20s linear infinite;
}

/* 👇 讓南瓜燈左右漂移，同時上下微微起伏 */
@keyframes driftPumpkin {
    0% { transform: translateX(0px) translateY(0px) rotate(-5deg); }
    50% { transform: translateX(150px) translateY(-15px) rotate(5deg); }
    100% { transform: translateX(0px) translateY(0px) rotate(-5deg); }
}
      /* ========== 草地上的南瓜燈 ========== */
.ground-pumpkin {
    position: absolute;
    z-index: 2; /* 在草地之上，但不會擋住點擊 */
    pointer-events: none; /* 讓滑鼠點擊穿透 */
    filter: drop-shadow(0px 10px 5px rgba(0, 0, 0, 0.5)); /* 深色陰影，看起來像放在地上 */
    /* 微微的呼吸發光動畫 */
    animation: glowPumpkin 2s infinite alternate;
}
@keyframes glowPumpkin {
    0% { filter: drop-shadow(0px 10px 5px rgba(0, 0, 0, 0.5)) brightness(1); }
    100% { filter: drop-shadow(0px 10px 15px rgba(230, 126, 34, 0.8)) brightness(1.2); }
}
          /* ========== 靠近店鋪的互動按鈕 ========== */
.enter-shop-btn {
    position: absolute;
    background: rgba(255, 255, 255, 0.95);
    border: 3px solid #e67e22;
    color: #2c3e50;
    padding: 8px 15px;
    border-radius: 20px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    
    /* 👇 把這裡改成 99999，讓它飛到所有圖層之上 */
    z-index: 99999; 
    
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    animation: bounceIn 0.3s ease-out;
    display: none;
}
.enter-shop-btn:hover {
    background: #e67e22;
    color: white;
}
@keyframes bounceIn {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}
    </style>

        "哈基姿": "https://cdn.html2.link/images/kGW-5UAR0_f8cKIY29vYa/NjFtN4G5NWqAIxxKMSHl5.png",
        "哈基桐": "https://cdn.html2.link/images/kGW-5UAR0_f8cKIY29vYa/8HwMFDsm3pFIkuyvYQsLF.png",
        "哈基晴": "https://cdn.html2.link/images/kGW-5UAR0_f8cKIY29vYa/iGQvNqad3Ro3cm5pJjZEl.png",
        "哈基悠": "https://cdn.html2.link/images/kGW-5UAR0_f8cKIY29vYa/_eraSmF87FzBfL7JVkvY9.png",
        "哈基心": "https://cdn.html2.link/images/kGW-5UAR0_f8cKIY29vYa/IfGDftaIFwJPXu9tlWIHU.png"
    };

    const defaultCatSvg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M20,60 Q10,30 30,20 Q50,10 70,20 Q90,30 80,60 Q95,80 80,90 Q50,95 20,90 Q5,80 20,60 Z' fill='white' stroke='%232c3e50' stroke-width='5'/><circle cx='40' cy='50' r='4' fill='%232c3e50'/><circle cx='60' cy='50' r='4' fill='%232c3e50'/><path d='M45,60 Q50,65 55,60' fill='none' stroke='%232c3e50' stroke-width='3'/></svg>";

    // 設定所有貓咪初始出生在溫馨家園附近，並用座標錯開避免重疊
    const baseX = 1700, baseY = 800; 
    const catsData = {
        "哈基葵": { breed: "布偶貓", duty: "🏡 家園長", duty_cn: "🏡 家园长", x: baseX, y: baseY, facing: "right" },
        "哈基芝": { breed: "土耳其安哥拉貓", duty: "🍹 奶茶店長", duty_cn: "🍹 奶茶店长", x: baseX + 120, y: baseY, facing: "left" },
        "哈基游": { breed: "三花貓", duty: "🍰 甜品店長", duty_cn: "🍰 甜品店长", x: baseX + 240, y: baseY, facing: "right" },
        "哈基慈": { breed: "委屈喵", duty: "📖 書店長", duty_cn: "📖 书店长", x: baseX, y: baseY + 120, facing: "right" },
        "哈基琪": { breed: "心心", duty: "🕹️ 夾玩偶店長", duty_cn: "🕹️ 夹玩偶店长", x: baseX + 120, y: baseY + 120, facing: "left" },
        "哈基之": { breed: "奶牛貓", duty: "🏪 服裝店長", duty_cn: "🏪 服装店长", x: baseX + 240, y: baseY + 120, facing: "right" },
        "哈基一": { breed: "Ruby", duty: "☕ 咖啡店長", duty_cn: "☕ 咖啡店长", x: baseX, y: baseY + 240, facing: "left" },
        "哈基姿": { breed: "幸運", duty: "🍎 水果店長", duty_cn: "🍎 水果店长", x: baseX + 120, y: baseY + 240, facing: "right" },
        "哈基桐": { breed: "拉邦貓", duty: "🖼️ 畫廊店長", duty_cn: "🖼️ 画廊店长", x: baseX + 240, y: baseY + 240, facing: "left" },
        "哈基晴": { breed: "異國短毛貓", duty: "🛝 用品店長", duty_cn: "🛝 用品店长", x: baseX - 120, y: baseY, facing: "right" },
        "哈基悠": { breed: "土耳其梵貓", duty: "💄 化妝店長", duty_cn: "💄 化妆店长", x: baseX - 120, y: baseY + 120, facing: "left" },
        "哈基心": { breed: "伯曼貓", duty: "🧸 玩具店長", duty_cn: "🧸 玩具店长", x: baseX - 120, y: baseY + 240, facing: "right" }
    };

    // ==================== 全局變數 ====================
    let myCatName = "";
    let currentLang = 'tw'; 
    let zoomLevel = 1;
    let isWalking = false;
    let moveInterval = null;
    const MAP_WIDTH = 4000;
    const MAP_HEIGHT = 4500;
    const CAT_SIZE = 80;
    const SAFE_BUFFER = 10; // 讓貓咪可以靠近邊界，但不會掉進海裡

    // ==================== 初始化與流程 ====================
    window.onload = function() {
        currentLang = 'tw';
        renderSelectGrid();
    };

    function renderSelectGrid() {
        const grid = document.getElementById("select-grid");
        grid.innerHTML = "";
        document.getElementById("select-title").innerText = currentLang === 'tw' ? "請選擇你要扮演的貓咪" : "请选择你要扮演的猫咪";
        
        for (let name in catsData) {
            const info = catsData[name];
            const displayDuty = currentLang === 'tw' ? info.duty : info.duty_cn;
            const imgSrc = catImages[name] || defaultCatSvg;
            const card = document.createElement("div");
            card.className = "select-card";
            card.onclick = () => selectCat(name);
            card.innerHTML = `
                <img src="${imgSrc}" alt="${name}">
                <div class="name">${name}</div>
                <div class="duty">${displayDuty}</div>
            `;
            grid.appendChild(card);
        }
    }

    function showSelectScreen() {
        document.getElementById("screen-start").classList.add("hidden");
        document.getElementById("screen-select").classList.remove("hidden");
    }

    function selectCat(name) {
        myCatName = name;
        document.getElementById("screen-select").classList.add("hidden");
        startTransition();
    }

    function startTransition() {
        const transScreen = document.getElementById("screen-transition");
        transScreen.classList.remove("hidden");
        
        const tCat = document.getElementById("transition-cat");
        tCat.src = catImages[myCatName] || defaultCatSvg;
        tCat.classList.remove("awake"); 

        setTimeout(() => { tCat.classList.add("awake"); }, 500);
        setTimeout(() => { document.getElementById("wake-text").style.opacity = "1"; }, 1500);
        setTimeout(() => { 
            transScreen.classList.add("hidden"); 
            enterGame(); 
        }, 3500);
    }

    function enterGame() {
        document.getElementById("game-container").style.display = "block";
        renderMapCats();
        centerMapOnPlayer();
        if (typeof checkShopProximity === 'function') {
            checkShopProximity();
    }
    }

    // ==================== 地圖與移動邏輯 ====================
    function renderMapCats() {
        const mapContent = document.getElementById("map-content");
        document.querySelectorAll('.cat-avatar').forEach(el => el.remove());

        for (let name in catsData) {
            const cat = catsData[name];
            const el = document.createElement("div");
            el.className = `cat-avatar facing-${cat.facing}`;
            el.id = `cat-${name}`;
            el.style.left = `${cat.x}px`;
            el.style.top = `${cat.y}px`;
            
            const imgSrc = catImages[name] || defaultCatSvg;
            el.innerHTML = `
                <div class="cat-name-tag">${name}</div>
                <img class="cat-img" src="${imgSrc}" alt="${name}" onerror="this.onerror=null; this.src='${defaultCatSvg}';">
            `;
            mapContent.appendChild(el);
        }
    }

    function centerMapOnPlayer() {
        const player = catsData[myCatName];
        const mapContent = document.getElementById("map-content");
        const area = document.getElementById("map-area");
        
        const centerX = area.clientWidth / 2;
        const centerY = area.clientHeight / 2;
        const catX = player.x + CAT_SIZE / 2;
        const catY = player.y + CAT_SIZE / 2;

        mapContent.style.transform = `translate(${centerX - (catX * zoomLevel)}px, ${centerY - (catY * zoomLevel)}px) scale(${zoomLevel})`;
    }

        function handleMapClick(e) {
    if (e.target.closest('.cat-avatar')) return;
    const mapContent = document.getElementById("map-content"), rect = mapContent.getBoundingClientRect();
    movePlayerTo((e.clientX - rect.left) / zoomLevel - 40, (e.clientY - rect.top) / zoomLevel - 40);
        }

    function stopPlayerMove() {
    if (moveInterval) { clearInterval(moveInterval); moveInterval = null; }
    isWalking = false;
    // 👇 到達目的地時，檢查是否靠近店鋪
    checkShopProximity();
    }

    function movePlayerTo(targetX, targetY) {
        stopPlayerMove();
        const player = catsData[myCatName];
        const el = document.getElementById(`cat-${myCatName}`);
        if (!el) return;

        // 邊界限制：不會掉進海裡 (0~MAP_WIDTH 之間)
        targetX = Math.max(SAFE_BUFFER, Math.min(targetX, MAP_WIDTH - CAT_SIZE - SAFE_BUFFER));
        targetY = Math.max(SAFE_BUFFER, Math.min(targetY, MAP_HEIGHT - CAT_SIZE - SAFE_BUFFER));

        if (targetX > player.x) {
            player.facing = "right";
            el.className = el.className.replace(/facing-\w+/, 'facing-right');
        } else {
            player.facing = "left";
            el.className = el.className.replace(/facing-\w+/, 'facing-left');
        }

        const speed = 10;
        moveInterval = setInterval(() => {
            const dx = targetX - player.x;
            const dy = targetY - player.y;
            const distance = Math.sqrt(dx*dx + dy*dy);

            if (distance < speed) {
                player.x = targetX; player.y = targetY;
                el.style.left = `${player.x}px`;
                el.style.top = `${player.y}px`;
                stopPlayerMove();
            } else {
                player.x += (dx / distance) * speed;
                player.y += (dy / distance) * speed;
                el.style.left = `${player.x}px`;
                el.style.top = `${player.y}px`;
                centerMapOnPlayer();
            }
        }, 30);
    }

    function manualZoom(dir) {
    const area = document.getElementById("map-area");
    const minZoom = Math.min(area.clientWidth / MAP_WIDTH, area.clientHeight / MAP_HEIGHT) * 0.9;
    
    if (dir > 0) zoomLevel = Math.min(zoomLevel + 0.2, 3);
    else zoomLevel = Math.max(zoomLevel - 0.2, minZoom);
    
    centerMapOnPlayer();
    }

    // ==================== 語言切換 ====================
    function toggleLang() {
        const btn = document.getElementById("btn-lang");
        currentLang = currentLang === 'tw' ? 'cn' : 'tw';
        const isTw = currentLang === 'tw';

        btn.innerText = isTw ? "简体中文" : "繁體中文";
        document.getElementById("announcement-text").innerText = isTw ? "歡迎來到哈基咪星球！" : "欢迎来到哈基咪星球！";
        document.getElementById("wake-text").innerText = isTw ? "歡迎來到哈基米星球～隨便玩樂吧～" : "欢迎来到哈基米星球～随便玩乐吧～";
        
        // 切換店鋪文字
        document.querySelectorAll('.building-text').forEach(el => {
            el.innerText = isTw ? el.getAttribute('data-tw') : el.getAttribute('data-cn');
        });

        // 重新渲染選角畫面以切換職位
        renderSelectGrid();
    }
      // ==================== 靠近店鋪偵測 ====================
let currentNearbyShop = null;

function checkShopProximity() {
    const player = catsData[myCatName];
    const buildings = document.querySelectorAll('.building');
    const btn = document.getElementById('enter-shop-btn');
    let nearShop = null;
    let minDistance = 350; 

    buildings.forEach(building => {
        const bX = parseFloat(building.style.left);
        const bY = parseFloat(building.style.top);
        const dist = Math.sqrt(Math.pow(player.x - bX, 2) + Math.pow(player.y - bY, 2));
        if (dist < minDistance) {
            nearShop = building;
            minDistance = dist;
        }
    });

    if (nearShop) {
        currentNearbyShop = nearShop;
        const shopName = nearShop.querySelector('.building-text').innerText;
        const isTw = currentLang === 'tw';
        
        btn.innerText = isTw ? `是否進入（${shopName}）` : `是否进入（${shopName}）`;
        
        const bX = parseFloat(nearShop.style.left);
        const bY = parseFloat(nearShop.style.top);
        const bW = nearShop.offsetWidth; // 取得店鋪寬度
        
        // 👇 這裡改成：店鋪中心點減去按鈕寬度的一半，讓它置中
        btn.style.left = `${bX + bW / 2}px`;
        // 使用 transform 讓按鈕精準置中
        btn.style.transform = "translateX(-50%)"; 
        
        // 👇 高度設在店鋪上方 70px 處
        btn.style.top = `${bY - 70}px`; 
        
        btn.style.display = "block";
    } else {
        currentNearbyShop = null;
        btn.style.display = "none";
    }
}

function executeEnterShop() {
    if (!currentNearbyShop) return;
    
    // 👇 確保點擊按鈕時，不會觸發地圖的移動
    if (event) event.stopPropagation(); 

    const shopName = currentNearbyShop.querySelector('.building-text').innerText;
    const isTw = currentLang === 'tw';

    // ... 下面的 alert 彈窗保留 ...

    // 這裡我們先寫死：點擊按鈕後彈出對應的提示或小遊戲
    if (shopName.includes("服裝店")) {
        alert(isTw ? "👗 進入服裝店！(小遊戲開發中...)" : "👗 进入服装店！(小游戏开发中...)");
    } else if (shopName.includes("溫馨家園") || shopName.includes("温馨家园")) {
        alert(isTw ? "🏚️ 進入鬼屋家園！(鬼屋探索開發中...)" : "🏚️ 进入鬼屋家园！(鬼屋探索开发中...)");
    } else {
        alert(isTw ? `🚪 你進入了 ${shopName}！` : `🚪 你进入了 ${shopName}！`);
    }
    
    // 進入後隱藏按鈕
    document.getElementById('enter-shop-btn').style.display = "none";
    currentNearbyShop = null;
}
    
</script>
