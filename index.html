<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🪐 哈基咪星球 🪐</title>
    <style>
        /* ========== 全局樣式 ========== */
        body { background-color: #f7f9fa; color: #2c3e50; font-family: 'Courier New', Courier, monospace, "微軟正黑體"; margin: 0; padding: 0; overflow: hidden; }
        h1, h2, h3 { margin: 5px 0; }
        button { font-family: inherit; font-weight: bold; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        button:hover { background-color: #2c3e50 !important; color: white !important; }
        .hidden { display: none !important; }

        /* ========== 首頁與選角 ========== */
        #screen-start, #screen-select { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f7f9fa; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .btn-main { padding: 15px 40px; font-size: 20px; background: white; border: 3px solid #2c3e50; box-shadow: 5px 5px 0px #2c3e50; margin-top: 20px; }
        .select-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; max-height: 70vh; overflow-y: auto; padding: 20px; background: white; border: 3px solid #2c3e50; border-radius: 8px; margin-top: 20px; }
        .select-card { border: 2px solid #2c3e50; border-radius: 6px; padding: 10px; background: #f8f9fa; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; }
        .select-card:hover { transform: scale(1.05); background: #e2e7ea; }
        .select-card img { width: 80px; height: 80px; object-fit: contain; animation: floatIdle 2s infinite ease-in-out; }
        .select-card .name { font-weight: bold; margin-top: 5px; }
        .select-card .duty { font-size: 11px; color: #7f8c8d; }

        /* ========== 開場過場動畫 ========== */
        #screen-transition { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10001; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .cushion { width: 150px; height: 60px; background: #8e44ad; border-radius: 50%; position: relative; display: flex; justify-content: center; align-items: center; border: 4px solid #2c3e50; transition: all 1s; }
        .wake-cat { width: 100px; height: 100px; position: absolute; bottom: 20px; opacity: 0.5; transform: rotate(-90deg); transition: all 1s; }
        .wake-cat.awake { opacity: 1; transform: rotate(0deg); bottom: 40px; }
        .wake-text { margin-top: 30px; font-size: 20px; opacity: 0; transition: opacity 1s; font-weight: bold; color: #2ecc71; }

        /* ========== 遊戲主介面 ========== */
        #game-container { display: none; width: 100vw; height: 100vh; position: relative; }
        
        /* 頂部導航與公告 */
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: white; border-bottom: 3px solid #2c3e50; position: relative; z-index: 10; }
        .nav-btns button { border: 2px solid #2c3e50; background: white; padding: 5px 10px; margin-left: 5px; font-size: 13px; }
        .server-announcement { font-size: 12px; color: #e74c3c; font-weight: bold; animation: blink 2s infinite; }

        /* 地圖區域 */
        #map-area { position: absolute; top: 65px; bottom: 0; left: 0; right: 0; overflow: hidden; background-image: radial-gradient(#bdc3c7 2px, transparent 0); background-size: 30px 30px; cursor: crosshair; }
        #map-content { position: absolute; width: 2000px; height: 2000px; transform-origin: center center; transition: transform 0.2s ease-out; }
        
        /* 建築與地板 */
        .building { position: absolute; border: 3px solid #2c3e50; background: rgba(255,255,255,0.9); padding: 10px; border-radius: 8px; font-weight: bold; font-size: 14px; text-align: center; cursor: pointer; box-shadow: 5px 5px 0px rgba(0,0,0,0.1); user-select: none; }
        .building:hover { background: #e2e7ea; }

        /* 地圖上的貓咪角色 */
        .cat-avatar { position: absolute; width: 80px; height: 80px; transition: top 0.5s linear, left 0.5s linear, transform 0.3s; cursor: pointer; z-index: 5; display: flex; justify-content: center; align-items: flex-end; }
        .cat-img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0px 5px 2px rgba(0,0,0,0.2)); }
        .cat-name-tag { position: absolute; top: -20px; background: rgba(255,255,255,0.8); border: 1px solid #2c3e50; border-radius: 10px; padding: 1px 6px; font-size: 10px; font-weight: bold; white-space: nowrap; pointer-events: none; }
        
        /* 貓咪動畫 */
        .is-walking .cat-img { animation: walkBounce 0.3s infinite alternate; }
        .is-idle .cat-img { animation: breathe 2s infinite ease-in-out; }
        .is-zoomed .cat-img { animation: lookAround 3s infinite ease-in-out; }
        .is-petting .cat-img { animation: petBounce 0.5s ease; }

        @keyframes floatIdle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes walkBounce { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(-10px) rotate(5deg); } }
        @keyframes lookAround { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }
        @keyframes petBounce { 0% { transform: scale(1); } 50% { transform: scale(1.3) translateY(-15px); } 100% { transform: scale(1); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* ========== 彈出視窗 (Modal) ========== */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; display: none; }
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; border: 4px solid #2c3e50; border-radius: 8px; padding: 20px; z-index: 1000; width: 350px; max-height: 80vh; overflow-y: auto; box-shadow: 8px 8px 0px #2c3e50; display: none; }
        .modal h3 { text-align: center; color: #2980b9; border-bottom: 2px solid #2c3e50; padding-bottom: 10px; }
        .modal-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .modal-btns button { padding: 10px; font-size: 14px; border: 2px solid #2c3e50; background: white; }
        .modal-btns button.close-btn { background: #e74c3c; color: white; border-color: #c0392b; }
        
        /* 聊天室專用 */
        .chat-container { display: flex; flex-direction: column; height: 300px; }
        #chat-box { flex: 1; overflow-y: auto; border: 2px solid #2c3e50; padding: 10px; background: #f8f9fa; font-size: 13px; margin-bottom: 10px; }
        .chat-input-area { display: flex; gap: 5px; }
        .chat-input-area input { flex: 1; border: 2px solid #2c3e50; padding: 5px; font-family: inherit; }
        .chat-msg { margin-bottom: 5px; padding: 5px; border-radius: 4px; background: white; border: 1px solid #ddd; }
        .chat-msg.user { background: #e2e7ea; }

        /* 背包、郵箱、首領面板專用 */
        .item-list { list-style: none; padding: 0; margin: 0; }
        .item-list li { border: 2px solid #2c3e50; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; border-radius: 4px; }
        .item-list li button { padding: 3px 8px; font-size: 12px; background: white; border: 1px solid #2c3e50; }
        /* ========== 手機版 RWD 響應式優化 ========== */
        @media screen and (max-width: 768px) {
        .top-nav { flex-direction: column; padding: 5px 10px; gap: 5px; }
        .nav-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
        .nav-btns button { margin-left: 0; padding: 5px 8px; font-size: 12px; }
        .server-announcement { font-size: 11px; text-align: center; width: 100%; }
    
        .select-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; width: 95%; padding: 10px; }
        .select-card img { width: 60px; height: 60px; }
        .select-card .name { font-size: 14px; }
    
        .modal { width: 90%; max-height: 80vh; padding: 15px; }
        #map-area { height: calc(100vh - 120px); }
        .cat-avatar { width: 60px; height: 60px; }
        .building { font-size: 12px; padding: 6px; }
}

    /* 手機縮放提示按鈕 (給沒有滾輪的手機用) */
    .zoom-controls { position: absolute; right: 15px; bottom: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
    .zoom-controls button { width: 40px; height: 40px; font-size: 20px; background: white; border: 2px solid #2c3e50; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 2px 2px 0px #2c3e50; }
    </style>
</head>
<body>

    <!-- 1. 首頁 -->
    <div id="screen-start">
        <h1>🪐 哈基咪星球 🪐</h1>
        <p style="color:#7f8c8d; font-weight:bold;">一個純貓手繪線條烏托邦</p>
        <button class="btn-main" onclick="showSelectScreen()">進入遊戲</button>
    </div>

    <!-- 2. 選角畫面 -->
    <div id="screen-select" class="hidden">
        <h2>請選擇你要扮演的貓咪</h2>
        <div class="select-grid" id="select-grid"></div>
    </div>

    <!-- 3. 過場動畫 -->
    <div id="screen-transition" class="hidden">
        <div class="cushion">
            <img id="transition-cat" class="wake-cat" src="" alt="cat">
        </div>
        <div id="wake-text" class="wake-text">歡迎來到哈基米星球～隨便玩樂吧～</div>
    </div>

    <!-- 4. 遊戲主畫面 -->
    <div id="game-container">
        <!-- 頂部 -->
        <div class="top-nav">
            <div class="server-announcement" id="announcement-text">歡迎來到哈基咪星球！</div>
            <div class="nav-btns">
                <button onclick="toggleModal('modal-bag')">🎒 背包</button>
                <button onclick="toggleModal('modal-mail')">📧 郵箱</button>
                <button onclick="toggleModal('modal-chat')">💬 聊天室</button>
                <button onclick="toggleLang()" id="btn-lang">简体中文</button>
                <button id="admin-btn" class="hidden" onclick="toggleModal('modal-admin')" style="color: #e74c3c; border-color: #e74c3c;">👑 首領面板</button>
                <button id="officer-btn" class="hidden" onclick="toggleModal('modal-officer')" style="color: #2980b9; border-color: #2980b9;">🎖️ 長官面板</button>
            </div>
        </div>

        <!-- 地圖 -->
        <div id="map-area" onclick="handleMapClick(event)" ondblclick="handleMapDblClick(event)">
            <div id="map-content">
                <!-- 建築 (絕對定位) -->
                <div class="building" style="left: 900px; top: 900px;" onclick="movePlayerTo(900, 900); event.stopPropagation();">🏡 溫馨家園「12」</div>
                <div class="building" style="left: 600px; top: 600px;" onclick="movePlayerTo(600, 600); event.stopPropagation();">☕ 咖啡廳</div>
                <div class="building" style="left: 1200px; top: 1200px;" onclick="movePlayerTo(1200, 1200); event.stopPropagation();">🍹 奶茶店</div>
                <div class="building" style="left: 400px; top: 1000px;" onclick="movePlayerTo(400, 1000); event.stopPropagation();">📖 貓咪書店</div>
                <!-- 其他貓咪和玩家會由 JS 動態生成 -->
          <div class="zoom-controls">
                <button onclick="manualZoom(1); event.stopPropagation();">➕</button>
                <button onclick="manualZoom(-1); event.stopPropagation();">➖</button>
              </div>
            </div>
        </div>
    </div>

    <!-- ========== 彈出視窗區 ========== -->

    <!-- 聊天室 -->
    <div id="modal-chat" class="modal">
        <h3>💬 貓咪聊天室</h3>
        <div class="chat-container">
            <div id="chat-box"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="輸入訊息..." onkeypress="if(event.key === 'Enter') sendChatMessage()">
                <button onclick="sendChatMessage()" style="background:white; border:2px solid #2c3e50; padding:5px;">發送</button>
            </div>
        </div>
        <div class="modal-btns"><button class="close-btn" onclick="toggleModal('modal-chat')">關閉</button></div>
    </div>

    <!-- 背包 -->
    <div id="modal-bag" class="modal">
        <h3>🎒 我的背包</h3>
        <ul class="item-list" id="bag-list"></ul>
        <div class="modal-btns"><button class="close-btn" onclick="toggleModal('modal-bag')">關閉</button></div>
    </div>

    <!-- 郵箱 -->
    <div id="modal-mail" class="modal">
        <h3>📧 貓咪郵箱</h3>
        <ul class="item-list" id="mail-list"></ul>
        <div class="modal-btns"><button class="close-btn" onclick="toggleModal('modal-mail')">關閉</button></div>
    </div>

    <!-- 打招呼互動 -->
    <div id="modal-interact" class="modal">
        <h3 id="interact-title">與 哈基葵 打招呼</h3>
        <p style="text-align:center; font-size:12px; color:#7f8c8d;">你們在這裡相遇了，要做些什麼呢？</p>
        <div class="modal-btns">
            <button onclick="doInteractAction()">🐾 做動作 (蹭蹭)</button>
            <button onclick="openGiftPanel()">🎁 送禮物</button>
            <button class="close-btn" onclick="toggleModal('modal-interact')">關閉</button>
        </div>
    </div>

    <!-- 送禮子選單 -->
    <div id="modal-gift" class="modal" style="width: 250px;">
        <h3>選擇禮物</h3>
        <ul class="item-list" id="gift-list"></ul>
        <div class="modal-btns"><button class="close-btn" onclick="toggleModal('modal-gift')">取消</button></div>
    </div>

    <!-- 首領專屬面板 -->
    <div id="modal-admin" class="modal">
        <h3>👑 首領·葵貓的專屬後台</h3>
        <p style="font-size:12px; color:#7f8c8d;">身份驗證通過。言君（哈基一）、何藍豆（哈基游）向您問好。</p>
        <div style="margin-bottom:15px;">
            <label style="font-weight:bold; font-size:13px;">發送全服公告：</label><br>
            <input type="text" id="admin-announce-input" style="width:90%; border:2px solid #2c3e50; padding:5px; margin-top:5px;" placeholder="輸入要廣播的內容...">
            <button onclick="sendAdminAnnounce()" style="margin-top:5px; border:2px solid #2c3e50; padding:5px 10px; background:white;">發送</button>
        </div>
        <h4 style="margin:0 0 5px 0;">客服反饋信件：</h4>
        <ul class="item-list" id="admin-feedback-list" style="max-height:200px; overflow-y:auto;"></ul>
        <div class="modal-btns"><button class="close-btn" onclick="toggleModal('modal-admin')">關閉</button></div>
    </div>

    <!-- 遮罩層 -->
    <div id="modal-overlay" class="modal-overlay" onclick="closeAllModals()"></div>

    // ==================== 初始化與流程 ====================
    window.onload = function() {
        renderSelectGrid();

    function renderSelectGrid() {
        const grid = document.getElementById("select-grid");
        grid.innerHTML = "";
        for (let name in catsData) {
            const info = catsData[name];
            const imgSrc = catImages[name] || defaultCatSvg;
            const card = document.createElement("div");
            card.className = "select-card";
            card.onclick = () => selectCat(name);
            card.innerHTML = `
                <img src="${imgSrc}" alt="${name}">
                <div class="name">${name}</div>
                <div class="duty">${info.duty}</div>
            `;
            grid.appendChild(card);
        }
    }

    function showSelectScreen() {
        document.getElementById("screen-start").classList.add("hidden");
        document.getElementById("screen-select").classList.remove("hidden");
    }

    function selectCat(name) {
        myCatName = name;
        isAdmin = (name === "哈基葵"); // 只有選擇哈基葵才開啟首領權限
        isOfficer = (name === "哈基一") ||( name === "哈基游");
        document.getElementById("screen-select").classList.add("hidden");
        startTransition();
    }

    function startTransition() {
        const transScreen = document.getElementById("screen-transition");
        transScreen.classList.remove("hidden");
        
        const tCat = document.getElementById("transition-cat");
        tCat.src = catImages[myCatName] || defaultCatSvg;
        
        // 動畫: 躺平 -> 睜眼 -> 抬頭
        setTimeout(() => {
            tCat.classList.add("awake");
        }, 500);

        setTimeout(() => {
            document.getElementById("wake-text").style.opacity = "1";
        }, 1500);

        setTimeout(() => {
            transScreen.classList.add("hidden");
            enterGame();
        }, 4000);
    }

    function enterGame() {
        document.getElementById("game-container").style.display = "block";
        if (isAdmin) document.getElementById("admin-btn").classList.remove("hidden");
      if (isOfficer) document.getElementById("officer-btn").classList.remove("hidden");
        
        // 玩家上線
        catsData[myCatName].isOnline = true;
        
        // 初始化地圖角色
        renderMapCats();
        
        // 將地圖中心移動到玩家位置
        centerMapOnPlayer();

        // 初始化背包與郵箱
        renderBag();
        renderMails();
        renderAdminFeedback();
        renderOfficerFeedback();
    }

    // ==================== 地圖與移動邏輯 ====================
    function renderMapCats() {
        const mapContent = document.getElementById("map-content");
        // 清除現有貓咪
        document.querySelectorAll('.cat-avatar').forEach(el => el.remove());

        for (let name in catsData) {
            const cat = catsData[name];
            if (!cat.isOnline) continue; // 只有線上貓咪顯示在地圖上

            const el = document.createElement("div");
            el.className = `cat-avatar is-idle ${zoomLevel > 1.5 ? 'is-zoomed' : ''}`;
            el.id = `cat-${name}`;
            el.style.left = `${cat.x}px`;
            el.style.top = `${cat.y}px`;
            el.style.transform = `scaleX(${cat.facing === 'left' ? -1 : 1})`;
            
            const imgSrc = catImages[name] || defaultCatSvg;
            el.innerHTML = `
                <div class="cat-name-tag">${name}</div>
                <img class="cat-img" src="${imgSrc}" alt="${name}">
            `;
            
            // 點擊其他貓咪
            if (name !== myCatName) {
                el.onclick = (e) => {
                    e.stopPropagation();
                    openInteract(name);
                };
            }
            
            mapContent.appendChild(el);
        }
    }

    function centerMapOnPlayer() {
        const player = catsData[myCatName];
        const mapContent = document.getElementById("map-content");
        const area = document.getElementById("map-area");
        
        // 計算中心點
        const centerX = area.clientWidth / 2;
        const centerY = area.clientHeight / 2;
        
        // 計算位移 (加上縮放偏移)
        const translateX = centerX - (player.x + CAT_SIZE/2) * zoomLevel;
        const translateY = centerY - (player.y + CAT_SIZE/2) * zoomLevel;

        mapContent.style.transform = `translate(${translateX}px, ${translateY}px) scale(${zoomLevel})`;
    }

    // 點擊地圖移動
    function handleMapClick(e) {
        if (e.target.closest('.cat-avatar') || e.target.closest('.building')) return;
        
        const mapContent = document.getElementById("map-content");
        const rect = mapContent.getBoundingClientRect();
        
        // 換算回地圖內的實際座標
        const clickX = (e.clientX - rect.left) / zoomLevel;
        const clickY = (e.clientY - rect.top) / zoomLevel;
        
        movePlayerTo(clickX - CAT_SIZE/2, clickY - CAT_SIZE/2);
    }

    // 雙擊地圖停止
    function handleMapDblClick(e) {
        if (e.target.closest('.cat-avatar') || e.target.closest('.building')) return;
        stopPlayerMove();
    }

    function stopPlayerMove() {
        if (moveInterval) {
            clearInterval(moveInterval);
            moveInterval = null;
        }
        isWalking = false;
        const el = document.getElementById(`cat-${myCatName}`);
        if (el) {
            el.classList.remove('is-walking');
            el.classList.add('is-idle');
        }
    }

    function movePlayerTo(targetX, targetY) {
        stopPlayerMove();
        const player = catsData[myCatName];
        const el = document.getElementById(`cat-${myCatName}`);
        if (!el) return;

        // 邊界限制
        targetX = Math.max(0, Math.min(targetX, MAP_SIZE - CAT_SIZE));
        targetY = Math.max(0, Math.min(targetY, MAP_SIZE - CAT_SIZE));

        // 面向
        if (targetX > player.x) {
            player.facing = "right";
            el.style.transform = `scaleX(1)`;
        } else {
            player.facing = "left";
            el.style.transform = `scaleX(-1)`;
        }

        el.classList.remove('is-idle');
        el.classList.add('is-walking');

        const speed = 7; // 移動速度
        moveInterval = setInterval(() => {
            const dx = targetX - player.x;
            const dy = targetY - player.y;
            const distance = Math.sqrt(dx*dx + dy*dy);

            if (distance < speed) {
                player.x = targetX;
                player.y = targetY;
                el.style.left = `${player.x}px`;
                el.style.top = `${player.y}px`;
                stopPlayerMove();
                checkProximity();
            } else {
                player.x += (dx / distance) * speed;
                player.y += (dy / distance) * speed;
                el.style.left = `${player.x}px`;
                el.style.top = `${player.y}px`;
                // 讓鏡頭跟隨
                centerMapOnPlayer();
            }
        }, 30);
    }

    // 滾輪縮放
    document.getElementById("map-area").addEventListener("wheel", (e) => {
        e.preventDefault();
        if (e.deltaY < 0) zoomLevel = Math.min(zoomLevel + 0.1, 3); // 最大放大3倍
        else zoomLevel = Math.max(zoomLevel - 0.1, 0.5); // 最小縮小0.5倍
        
        centerMapOnPlayer();
        
        // 判斷是否放大到一定程度，切換精細動作
        const el = document.getElementById(`cat-${myCatName}`);
        if (el) {
            if (zoomLevel > 1.5) el.classList.add('is-zoomed');
            else el.classList.remove('is-zoomed');
        }
    });

    // 檢查是否靠近其他貓咪
    function checkProximity() {
        const player = catsData[myCatName];
        let nearCat = "";
        for (let name in catsData) {
            if (name === myCatName || !catsData[name].isOnline) continue;
            const other = catsData[name];
            const distance = Math.sqrt(Math.pow(player.x - other.x, 2) + Math.pow(player.y - other.y, 2));
            if (distance < 100) {
                nearCat = name;
                break;
            }
        }
        
        if (nearCat) {
            openInteract(nearCat);
        }
    }

    // ==================== 打招呼互動 ====================
    function openInteract(catName) {
        targetInteractCat = catName;
        const cat = catsData[catName];
        
        let title = `與 ${catName} 打招呼`;
        // 特殊身份彩蛋
        if (myCatName === "哈基葵") {
            if (catName === "哈基一") title = `與 言君 (哈基一) 打招呼`;
            if (catName === "哈基游") title = `與 何藍豆 (哈基游) 打招呼`;
        }

        document.getElementById("interact-title").innerText = title;
        toggleModal('modal-interact');
    }

    function doInteractAction() {
        // 玩家跳躍動作
        const pEl = document.getElementById(`cat-${myCatName}`);
        if (pEl) {
            pEl.classList.add('is-petting');
            setTimeout(() => pEl.classList.remove('is-petting'), 500);
        }
        
        // 對方貓咪也跳躍
        const oEl = document.getElementById(`cat-${targetInteractCat}`);
        if (oEl) {
            oEl.classList.add('is-petting');
            setTimeout(() => oEl.classList.remove('is-petting'), 500);
        }

        addChatMessage("系統", `你與 ${targetInteractCat} 蹭了蹭！好感度上升！`, false);
        toggleModal('modal-interact');
    }

    function openGiftPanel() {
        toggleModal('modal-interact');
        const list = document.getElementById("gift-list");
        list.innerHTML = "";
        for (let item in playerBag) {
            if (playerBag[item] > 0) {
                const li = document.createElement("li");
                li.innerHTML = `
                    <span>${item} (x${playerBag[item]})</span>
                    <button onclick="sendGift('${item}')">送出</button>
                `;
                list.appendChild(li);
            }
        }
        if (list.innerHTML === "") {
            list.innerHTML = "<li>背包空空如也，無法送禮。</li>";
        }
        toggleModal('modal-gift');
    }

    function sendGift(item) {
        if (playerBag[item] > 0) {
            playerBag[item]--;
            renderBag();
            addChatMessage("系統", `你送給了 ${targetInteractCat} 一個 ${item}！`, false);
            toggleModal('modal-gift');
            // 假裝對方回信
            setTimeout(() => {
                mails.push({
                    id: Date.now(), sender: targetInteractCat, title: "感謝你的禮物", content: `謝謝你送的 ${item}，我很喜歡！`, item: null, amount: 0, claimed: false
                });
                renderMails();
            }, 2000);
        }
    }

    // ==================== 聊天室 ====================
    function sendChatMessage() {
        const input = document.getElementById("chat-input");
        const text = input.value.trim();
        if (!text) return;

        addChatMessage(myCatName, text, true);
        input.value = "";

        // 隨機貓咪回覆
        setTimeout(() => {
            const cats = Object.keys(catsData).filter(c => c !== myCatName);
            const randomCat = cats[Math.floor(Math.random() * cats.length)];
            const replies = ["喵嗚～", "你說得對！", "今天天氣真好～", "我也這麼覺得！", "要吃罐罐嗎？"];
            const reply = replies[Math.floor(Math.random() * replies.length)];
            addChatMessage(randomCat, reply, false);
        }, 1000);
    }

    function addChatMessage(sender, text, isUser) {
        chatHistory.push({ sender, text, isUser });
        renderChat();
    }

    function renderChat() {
        const box = document.getElementById("chat-box");
        box.innerHTML = chatHistory.map(msg => `
            <div class="chat-msg ${msg.isUser ? 'user' : ''}">
                <strong>${msg.sender}:</strong> ${msg.text}
            </div>
        `).join('');
        box.scrollTop = box.scrollHeight;
    }

    // ==================== 背包與郵箱 ====================
    function renderBag() {
        const list = document.getElementById("bag-list");
        list.innerHTML = "";
        for (let item in playerBag) {
            if (playerBag[item] > 0) {
                list.innerHTML += `<li><span>${item}</span> <span>x${playerBag[item]}</span></li>`;
            }
        }
        if (list.innerHTML === "") list.innerHTML = "<li>背包空空如也。</li>";
    }

    function renderMails() {
        const list = document.getElementById("mail-list");
        list.innerHTML = "";
        mails.forEach(mail => {
            list.innerHTML += `
                <li>
                    <div>
                        <strong>${mail.sender}</strong>: ${mail.title}<br>
                        <span style="font-size:11px; color:#7f8c8d;">${mail.content}</span>
                    </div>
                    <div>
                        ${!mail.claimed ? `<button onclick="claimMail(${mail.id})">領取附件</button>` : `<span style="color:#27ae60; font-size:12px;">已領取</span>`}
                    </div>
                </li>
            `;
        });
        if (list.innerHTML === "") list.innerHTML = "<li>沒有新信件。</li>";
    }

    function claimMail(id) {
        const mail = mails.find(m => m.id === id);
        if (mail && !mail.claimed && mail.item) {
            playerBag[mail.item] = (playerBag[mail.item] || 0) + mail.amount;
            mail.claimed = true;
            renderBag();
            renderMails();
            alert(`獲得 ${mail.item} x${mail.amount}！`);
        } else if (mail && !mail.item) {
            mail.claimed = true;
            renderMails();
            alert("已閱讀信件。");
        }
    }

    // ==================== 首領專屬面板 ====================
    function renderAdminFeedback() {
        if (!isAdmin) return;
        const list = document.getElementById("admin-feedback-list");
        list.innerHTML = "";
        adminFeedback.forEach(fb => {
            let replyHtml = fb.reply ? `<div style="font-size:11px; color:#2980b9; margin-top:5px;">↳ 長官已回覆：${fb.reply}</div>` : "";
            list.innerHTML += `<li style="display:block;"><strong>${fb.sender}:</strong> ${fb.text} ${replyHtml}</li>`;
        });
    }

    function sendAdminAnnounce() {
        const input = document.getElementById("admin-announce-input");
        const text = input.value.trim();
        if (text) {
            document.getElementById("announcement-text").innerText = `【首領廣播】${text}`;
            input.value = "";
            alert("全服廣播已發送！");
            toggleModal('modal-admin');
        }
    }

    function toggleModal(id) {
        const el = document.getElementById(id);

    }

  // ==================== 手機觸控與縮放優化 ====================
let initialPinchDistance = 0;
let initialZoom = 1;

document.getElementById("map-area").addEventListener("touchstart", (e) => {
    if (e.touches.length === 2) {
        initialPinchDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
        initialZoom = zoomLevel;
    }
}, { passive: false });

document.getElementById("map-area").addEventListener("touchmove", (e) => {
    if (e.touches.length === 2) {
        e.preventDefault(); // 防止瀏覽器預設的頁面縮放
        const currentDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
        if (initialPinchDistance > 0) {
            const scaleFactor = currentDistance / initialPinchDistance;
            zoomLevel = Math.max(0.5, Math.min(initialZoom * scaleFactor, 3));
            centerMapOnPlayer();
            
            // 放大細節切換
            const el = document.getElementById(`cat-${myCatName}`);
            if (el) {
                if (zoomLevel > 1.5) el.classList.add('is-zoomed');
                else el.classList.remove('is-zoomed');
            }
        }
    }
}, { passive: false });

// 手機按鈕手動縮放
function manualZoom(dir) {
    if (dir > 0) zoomLevel = Math.min(zoomLevel + 0.2, 3);
    else zoomLevel = Math.max(zoomLevel - 0.2, 0.5);
    
    centerMapOnPlayer();
    
    const el = document.getElementById(`cat-${myCatName}`);
    if (el) {
        if (zoomLevel > 1.5) el.classList.add('is-zoomed');
        else el.classList.remove('is-zoomed');
    }
}
  // ==================== 手機專用：輕觸兩下停止移動 ====================
let lastTouchTime = 0;
document.getElementById("map-area").addEventListener("touchend", function(e) {
    const currentTime = new Date().getTime();
    const tapLength = currentTime - lastTouchTime;
    
    // 如果兩次點擊間隔小於 300 毫秒，且沒有點在貓咪或建築上
    if (tapLength < 300 && tapLength > 0 && !e.target.closest('.cat-avatar') && !e.target.closest('.building')) {
        stopPlayerMove(); // 觸發停止
        e.preventDefault();
    }
    lastTouchTime = currentTime;
});
